modLoader = "javafml"
loaderVersion = "[46,)"
license = "LGPLv3"

[[mods]]
modId = "litematica"
version = "${version}"
displayName = "Litematica"
displayURL = "https://github.com/maruohon/litematica"
logoFile = "assets/litematica/icon.png"
credits = "masa"
authors = "masa, Shiraishi Sayuki (multiloader port)"
description = '''
Client-side schematic viewer, editor and printer.
'''

[[mixins]]
config = "mixins.litematica.json"

[[dependencies.litematica]]
