[[dependencies.litematica]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20,1.21)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.litematica]]
modId = "malilib"
mandatory = true
versionRange = "[0.20.01,)"
ordering = "AFTER"
side = "CLIENT"
